name: E2E

on:
  repository_dispatch:
    types: [api-push, ui-push]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.E2E_PAT }}

      - name: Sync API
        uses: actions/checkout@v4
        with:
          repository: abdelaziz-ebourki/estore-api
          path: estore-api
          token: ${{ secrets.E2E_PAT }}

      - name: Sync UI
        uses: actions/checkout@v4
        with:
          repository: abdelaziz-ebourki/estore-ui
          path: estore-ui
          token: ${{ secrets.E2E_PAT }}

      - name: Commit & Push
        run: |
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          git add estore-api estore-ui
          if ! git diff --cached --quiet; then
            git commit -m "sync: update estore-api & estore-ui"
            git push
          fi

      - name: Build API Docker image
        run: docker compose build estore-api
        working-directory: .

      - name: Start services
        run: |
          docker compose up -d mysql mongodb estore-api
          echo "Waiting for API to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/api/products > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        working-directory: estore-ui
        run: npm ci

      - name: Install e2e dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run integration tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down
